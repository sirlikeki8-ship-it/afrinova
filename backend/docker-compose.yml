services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: afrinova
      POSTGRES_PASSWORD: afrinova_dev
      POSTGRES_DB: afrinova
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afrinova"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://afrinova:afrinova_dev@db:5432/afrinova
      SECRET_KEY: dev-secret-change-in-production
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
